name: Application Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - '.github/workflows/app-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - '.github/workflows/app-foundation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  app-foundation:
    name: App foundation (typecheck + tests + build + live probe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 127.0.0.1
      PORT: '3001'
      NODE_ENV: development
      # Least-privilege database boundary (see
      # 03_ARCHITECTURE/decisions/ADR-0005-least-privilege-database-boundary.md).
      # Four distinct synthetic-only connections/roles -- never interchangeable.
      DATABASE_URL: postgres://lmapp_api_reader:synthetic-ci-api-reader-password@127.0.0.1:5432/lmapp_dev
      LEASEMIND_MIGRATION_DATABASE_URL: postgres://lmapp_migrator:synthetic-ci-migrator-password@127.0.0.1:5432/lmapp_dev
      LEASEMIND_MAINTENANCE_DATABASE_URL: postgres://lmapp_maintainer:synthetic-ci-maintainer-password@127.0.0.1:5432/lmapp_dev
      LEASEMIND_BOOTSTRAP_DATABASE_URL: postgres://lmapp_dev:synthetic-dev-only-password@127.0.0.1:5432/lmapp_dev
      LEASEMIND_MIGRATOR_PASSWORD: synthetic-ci-migrator-password
      LEASEMIND_MAINTAINER_PASSWORD: synthetic-ci-maintainer-password
      LEASEMIND_API_READER_PASSWORD: synthetic-ci-api-reader-password
      LEASEMIND_RUNTIME_MODE: synthetic
      LEASEMIND_PRODUCTION_LAUNCH_GATE: blocked
      LEASEMIND_ALLOW_REAL_PII: 'false'
      LEASEMIND_ALLOW_REAL_PAYMENTS: 'false'
      LEASEMIND_ALLOW_PROTECTED_REVEAL: 'false'
      LEASEMIND_ALLOW_PRODUCTION_ADAPTERS: 'false'
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: lmapp_dev
          POSTGRES_PASSWORD: synthetic-dev-only-password
          POSTGRES_DB: lmapp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmapp_dev -d lmapp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Provision synthetic database roles
        run: npm run provision-roles --workspace apps/api

      - name: Typecheck (api + web)
        run: npm run typecheck

      - name: Backend tests
        run: npm run test --workspace apps/api

      - name: Frontend production build
        run: npm run build --workspace apps/web

      - name: Apply Campaign read model migration
        run: npm run migrate:up --workspace apps/api

      - name: Seed synthetic campaigns
        run: npm run seed --workspace apps/api

      - name: Start API for live probe
        run: |
          node --import tsx apps/api/src/server.ts &
          echo $! > api.pid

      - name: Probe /api/v1/health/live and /api/v1/health/ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/v1/health/live > /dev/null; then
              break
            fi
            if [ "$i" = "30" ]; then
              echo "API did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          live_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/health/live)
          if [ "$live_status" != "200" ]; then
            echo "live probe failed: HTTP $live_status" >&2
            exit 1
          fi

          ready_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/health/ready)
          if [ "$ready_status" != "200" ]; then
            echo "ready probe failed: HTTP $ready_status" >&2
            exit 1
          fi

          echo "live=200 ready=200"

      - name: Probe /api/v1/campaigns and /api/v1/campaigns/:campaignId
        run: |
          list_status=$(curl -s -o /tmp/campaigns-list.json -w '%{http_code}' http://127.0.0.1:3001/api/v1/campaigns)
          if [ "$list_status" != "200" ]; then
            echo "campaign list probe failed: HTTP $list_status" >&2
            exit 1
          fi
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/campaigns-list.json','utf8')).campaigns.length)")
          if [ "$count" != "11" ]; then
            echo "expected 11 synthetic campaigns, got $count" >&2
            exit 1
          fi

          detail_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/campaigns/00000000-0000-4000-8000-000000000001)
          if [ "$detail_status" != "200" ]; then
            echo "campaign detail probe failed: HTTP $detail_status" >&2
            exit 1
          fi

          echo "campaigns list=200 (11 items) detail=200"

      - name: Stop API process
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
            rm -f api.pid
          fi

      - name: Revert Campaign read model migration
        if: always()
        run: npm run migrate:down --workspace apps/api
