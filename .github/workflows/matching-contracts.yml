name: Matching Engine Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - '05_DEVELOPMENT/matching-engine/**'
      - '.github/workflows/matching-contracts.yml'
  push:
    branches:
      - main
    paths:
      - '05_DEVELOPMENT/matching-engine/**'
      - '.github/workflows/matching-contracts.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: matching-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-suite:
    name: Contract suite (offline + PostgreSQL 18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 05_DEVELOPMENT/matching-engine/contract-tests/v1.0/source/LeaseMind_MATCHING_DATA_CONTRACTS_v1.0
    env:
      PGUSER: lmtest_admin
      PGPASSWORD: synthetic-ci-only-password-not-a-real-secret
      PGDATABASE: lmtest
      DATABASE_URL: postgres://lmtest_admin:synthetic-ci-only-password-not-a-real-secret@localhost:5432/lmtest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: lmtest_admin
          POSTGRES_PASSWORD: synthetic-ci-only-password-not-a-real-secret
          POSTGRES_DB: lmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmtest_admin -d lmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_DEVELOPMENT/matching-engine/contract-tests/v1.0/source/LeaseMind_MATCHING_DATA_CONTRACTS_v1.0/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Run contract suite (CT + EV + PostgreSQL)
        run: npm run verify

      - name: Verify suite left tracked files unchanged
        working-directory: .
        # synthetic_verification_report.json and postgres_execution.log are
        # non-deterministic runtime evidence (fresh timestamp/log hash on
        # every run) and are not part of the source manifest.sha256 -- they
        # are the only two paths excluded from this check.
        run: >-
          git diff --exit-code -- .
          ':!05_DEVELOPMENT/matching-engine/contract-tests/v1.0/source/LeaseMind_MATCHING_DATA_CONTRACTS_v1.0/synthetic_verification_report.json'
          ':!05_DEVELOPMENT/matching-engine/contract-tests/v1.0/source/LeaseMind_MATCHING_DATA_CONTRACTS_v1.0/postgres_execution.log'
