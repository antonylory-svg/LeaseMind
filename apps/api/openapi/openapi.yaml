openapi: 3.1.0
info:
  title: LeaseMind App Foundation API
  version: 1.3.0
  description: >-
    Synthetic-only contract for the ten HTTP operations that actually
    exist in apps/api/src/app.ts: two health probes, the Campaign Current
    State Projection read model, the Technical Assignment save-draft and
    read commands, and the atomic Campaign launch command (see
    03_ARCHITECTURE/decisions/ADR-0001-application-development-stack.md,
    ADR-0002-campaign-event-stream.md, ADR-0003-pre-launch-runtime-safety-gate.md,
    ADR-0004-read-only-api-contract.md,
    ADR-0007-synthetic-campaign-creation-command-boundary.md and
    ADR-0008-technical-assignment-implementation.md and
    ADR-0009-analysis-snapshot-implementation.md). No other write
    operation exists or is documented. PRODUCTION_LAUNCH_GATE remains
    blocked; this document does not authorize any production deployment,
    real personal data, real payments or protected-data disclosure.
servers:
  - url: http://127.0.0.1:3001
    description: >-
      Synthetic local development server only (see apps/api/.env.example).
      No production server exists.

paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      description: >-
        Always returns 200 regardless of database reachability. Never
        returns any other status code.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'

  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: Reports whether the process can currently reach PostgreSQL.
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyOkResponse'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

  /api/v1/campaigns:
    get:
      operationId: listCampaigns
      summary: List all synthetic Campaigns
      description: >-
        Returns every row of the derived, rebuildable Campaign Current
        State Projection (apps/api/migrations/001_campaign_current_state_projection.up.sql),
        ordered by campaign_id ascending. Read-only; see the POST operation
        below for the one write operation on this path.
      responses:
        '200':
          description: The full list of synthetic Campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

    post:
      operationId: launchCampaign
      summary: Atomically launch a new synthetic Campaign from a ready Technical Assignment
      description: >-
        The only write operation on this path. One atomic transaction:
        verifies the referenced Technical Assignment is
        `lifecycle_status=ready_for_analysis` at exactly `expected_revision`
        and that a valid Contacts Gate marker and current terminal pre-launch
        Analysis Snapshot are present, then atomically creates the synthetic
        Campaign in status `Created`, appends the
        `campaign.subject_linked.v1` provenance event, persists the Analysis
        authorization link and durable post-launch refresh intent, and marks
        the Technical Assignment `campaign_started`
        (apps/api/src/db/launchCampaign.ts). campaign_id, aggregate_version,
        created_at and updated_at are always server-generated; campaign_id
        is derived deterministically from idempotency_key, so retrying the
        same command with the same idempotency_key returns the same
        Campaign instead of creating a duplicate (200, not 201). The
        request body accepts no name, phone, email or any other contact
        field. analysis_snapshot_id is optional in the transport schema only
        so legacy_v1 replays remain possible; every new launch requires it in
        application logic. See ADR-0007, ADR-0008 and ADR-0009.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchCampaignRequest'
      responses:
        '201':
          description: A new synthetic Campaign was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '200':
          description: >-
            idempotency_key was already used for this exact command; the
            existing Campaign is returned unchanged, no duplicate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: >-
            The request body is malformed, the Technical Assignment is not
            ready/found, its revision does not match expected_revision, the
            Analysis Snapshot is absent/invalid/stale, or the Contacts Gate
            marker is missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchCampaignErrorResponse'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

  /api/v1/technical-assignments:
    post:
      operationId: saveTechnicalAssignmentDraft
      summary: Create or update a synthetic Technical Assignment draft
      description: >-
        Creates a new draft on first call for a given idempotency_key, or
        updates an explicitly targeted draft when technical_assignment_id
        and expected_revision are both supplied. A changed update whose
        expected_revision is stale is rejected; an identical retry remains
        a no-op and returns the current revision.
        Exactly 30 approved Property fields (`scenario=need_tenant`) or 30
        approved TenantRequest fields (`scenario=need_property`) are
        accepted -- no other property, including any name/phone/email/
        contact field, can be submitted. `technical_assignment_id`,
        `revision` and `lifecycle_status` are always server-computed.
        `property_exact_address` is accepted but never returned in any
        response (see `has_exact_address`). See
        02_PRODUCT/CAMPAIGN_TECHNICAL_ASSIGNMENT.md and
        ADR-0008-technical-assignment-implementation.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTechnicalAssignmentRequest'
      responses:
        '201':
          description: A new Technical Assignment draft was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAssignment'
        '200':
          description: An existing Technical Assignment draft was updated (or an identical resubmission was a no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAssignment'
        '400':
          description: The request body is malformed, a field is invalid, a cross-field rule is violated, the scenario does not match the target, or expected_revision is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAssignmentErrorResponse'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

  /api/v1/technical-assignments/{technicalAssignmentId}:
    get:
      operationId: getTechnicalAssignmentById
      summary: Get a single Technical Assignment draft by id
      parameters:
        - name: technicalAssignmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '200':
          description: The matching Technical Assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAssignment'
        '404':
          description: No Technical Assignment exists with the given id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [TECHNICAL_ASSIGNMENT_NOT_FOUND]

  /api/v1/analysis-snapshots:
    post:
      operationId: createAnalysisSnapshot
      summary: Create, replay or explicitly retry a synthetic Analysis Snapshot
      description: >-
        The synchronous Sprint 5 command currently executes pre_launch
        synthetic_ru_v1 Analysis. The client supplies identity and revision
        only; all Technical Assignment fields and evidence are read by the
        server through the dedicated lmapp_analysis_writer identity. Durable
        idempotency is checked before current-attempt rules: a known key
        returns its originally mapped Snapshot, while different new keys for
        one logical request converge to one current attempt. post_launch_refresh
        is reserved by this transport contract but remains server-worker-owned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisSnapshotRequest'
      responses:
        '201':
          description: A new synchronous pre-launch attempt reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSnapshot'
        '202':
          description: A new asynchronous post-launch attempt remains pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSnapshot'
        '200':
          description: The command replayed or converged to an existing attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSnapshot'
        '400':
          description: The kind/Campaign shape or market is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '404':
          description: The referenced Technical Assignment does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '409':
          description: Revision, idempotency or explicit-retry state conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '503':
          description: The evidence dataset or Analysis database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'

  /api/v1/analysis-snapshots/{analysisSnapshotId}:
    get:
      operationId: getAnalysisSnapshotById
      summary: Read one persisted Analysis Snapshot
      parameters:
        - name: analysisSnapshotId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '200':
          description: The immutable Snapshot with read-time freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSnapshot'
        '404':
          description: Snapshot not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '503':
          description: The Analysis read model is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'

  /api/v1/technical-assignments/{technicalAssignmentId}/analysis-snapshots/current:
    get:
      operationId: getCurrentAnalysisSnapshot
      summary: Recover the current Analysis attempt for one logical request
      parameters:
        - name: technicalAssignmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: analysis_kind
          in: query
          required: true
          schema:
            type: string
            enum: [pre_launch, post_launch_refresh]
        - name: campaign_id
          in: query
          required: false
          description: Required for post_launch_refresh and forbidden for pre_launch.
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '200':
          description: Attempt with the maximum calculation_attempt for the full logical key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSnapshot'
        '400':
          description: analysis_kind and campaign_id are inconsistent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '404':
          description: No Snapshot exists for this logical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'
        '503':
          description: The Analysis read model is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisErrorResponse'

  /api/v1/campaigns/{campaignId}:
    get:
      operationId: getCampaignById
      summary: Get a single synthetic Campaign by id
      description: >-
        campaignId must be a UUID v4 or v7; any other syntactically valid
        UUID version (v1, v2, v3, v5, v6, v8) or malformed value is
        rejected with 400 before any database query runs
        (apps/api/src/uuid.ts). Unlike the list endpoint, the detail
        response additionally includes analysis_context (ADR-0009), read via
        a LEFT JOIN against campaign_subject_link_projection -- null for a
        legacy/unlinked Campaign.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4OrV7'
      responses:
        '200':
          description: The matching Campaign, with its Analysis launch context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '400':
          description: campaignId is not a well-formed UUID v4 or v7.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCampaignIdResponse'
        '404':
          description: No Campaign exists with the given campaignId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignNotFoundResponse'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

components:
  schemas:
    UuidV4OrV7:
      type: string
      description: UUID v4 or v7 only. Versions 1, 2, 3, 5, 6 and 8 are forbidden.
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[47][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'

    HealthLiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    HealthReadyOkResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [connected]

    ServiceUnavailableResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [error]
        database:
          type: string
          enum: [unreachable]

    Campaign:
      type: object
      additionalProperties: false
      required: [campaign_id, status, aggregate_version, created_at, updated_at]
      properties:
        campaign_id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            One of the 11 approved Campaign statuses
            (LeaseMind_AI_MANAGER_ARCHITECTURE_v1.0.md, Approved v1.0,
            section 5.3). No additions, renames or removals.
          enum:
            - Created
            - Analyzing
            - Strategy Building
            - Searching
            - Qualifying
            - Negotiating
            - Viewing
            - Deal Support
            - Completed
            - Paused
            - Failed
        aggregate_version:
          type: string
          pattern: '^[1-9][0-9]*$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CampaignAnalysisContext:
      description: >-
        Read-only, server-owned Technical Assignment / revision / scenario a
        Campaign was launched from (ADR-0009), letting the frontend ask
        GET /api/v1/technical-assignments/{technicalAssignmentId}/analysis-snapshots/current
        for the current post_launch_refresh Analysis Snapshot without a
        second read endpoint. null for a legacy/unlinked Campaign (no
        campaign_subject_link_projection row).
      nullable: true
      type: object
      additionalProperties: false
      required: [technical_assignment_id, source_revision, scenario]
      properties:
        technical_assignment_id:
          type: string
          format: uuid
        source_revision:
          type: integer
          minimum: 1
        scenario:
          type: string
          enum: [need_tenant, need_property]

    CampaignDetail:
      description: >-
        Detail-only shape returned by GET /api/v1/campaigns/{campaignId} --
        deliberately not used by the list endpoint (CampaignListResponse
        keeps the plain Campaign shape).
      type: object
      additionalProperties: false
      required: [campaign_id, status, aggregate_version, created_at, updated_at, analysis_context]
      properties:
        campaign_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - Created
            - Analyzing
            - Strategy Building
            - Searching
            - Qualifying
            - Negotiating
            - Viewing
            - Deal Support
            - Completed
            - Paused
            - Failed
        aggregate_version:
          type: string
          pattern: '^[1-9][0-9]*$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        analysis_context:
          $ref: '#/components/schemas/CampaignAnalysisContext'

    CampaignListResponse:
      type: object
      additionalProperties: false
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'

    InvalidCampaignIdResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [INVALID_CAMPAIGN_ID]

    CampaignNotFoundResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [CAMPAIGN_NOT_FOUND]

    LaunchCampaignRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, technical_assignment_id, expected_revision, contacts_gate_evidence]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Caller-generated deduplication token for this launch command.
            Never a contact field -- no other property is accepted on this
            request.
        technical_assignment_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        expected_revision:
          type: integer
          minimum: 1
          description: The Technical Assignment revision the caller last observed as ready_for_analysis; a mismatch means the Analysis the caller saw is stale.
        analysis_snapshot_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          description: >-
            Snapshot that authorizes the launch. Optional only for transport
            compatibility with legacy_v1 command replays; required by
            application logic for every new launch and stored permanently in
            the Campaign subject-link projection.
        contacts_gate_evidence:
          type: string
          minLength: 1
          maxLength: 100
          description: Synthetic-only Contacts Gate marker (ADR-0008 section 2). A real consent record is a Launch blocker, not implemented.

    LaunchCampaignErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - INVALID_IDEMPOTENCY_KEY
            - TECHNICAL_ASSIGNMENT_STATE_INVALID
            - TECHNICAL_ASSIGNMENT_ANALYSIS_REQUIRED
            - TECHNICAL_ASSIGNMENT_ANALYSIS_STALE
            - TECHNICAL_ASSIGNMENT_CONTACTS_GATE_REQUIRED
            - TECHNICAL_ASSIGNMENT_REVISION_CONFLICT

    TechnicalAssignmentErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        field_id:
          type: [string, 'null']
        error:
          type: string
          enum:
            - TECHNICAL_ASSIGNMENT_SCHEMA_UNSUPPORTED
            - TECHNICAL_ASSIGNMENT_SCENARIO_REQUIRED
            - TECHNICAL_ASSIGNMENT_SCENARIO_IMMUTABLE
            - TECHNICAL_ASSIGNMENT_STATE_INVALID
            - TECHNICAL_ASSIGNMENT_REVISION_CONFLICT
            - TECHNICAL_ASSIGNMENT_REQUIRED_FIELD_MISSING
            - TECHNICAL_ASSIGNMENT_FIELD_TYPE_INVALID
            - TECHNICAL_ASSIGNMENT_FIELD_VALUE_INVALID
            - TECHNICAL_ASSIGNMENT_CROSS_FIELD_CONFLICT
            - TECHNICAL_ASSIGNMENT_PERSONAL_DATA_FORBIDDEN
            - TECHNICAL_ASSIGNMENT_SECRET_FORBIDDEN

    SaveTechnicalAssignmentRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, scenario, payload]
      dependentRequired:
        technical_assignment_id: [expected_revision]
        expected_revision: [technical_assignment_id]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          description: Caller-generated command deduplication token. A first save binds its value to the newly created draft; restored-draft updates may use a fresh command token together with technical_assignment_id and expected_revision.
        technical_assignment_id:
          $ref: '#/components/schemas/UuidV4OrV7'
          description: Existing draft target. Must be supplied together with expected_revision for an update and omitted for the first save.
        expected_revision:
          type: integer
          minimum: 1
          description: Revision last observed by the caller. Must be supplied together with technical_assignment_id; a changed stale update is rejected.
        scenario:
          type: string
          enum: [need_tenant, need_property]
        payload:
          description: Exactly the 30 Property fields (need_tenant) or 30 TenantRequest fields (need_property) -- see PropertyPayload / TenantRequestPayload. No other property is accepted.
          oneOf:
            - $ref: '#/components/schemas/PropertyPayload'
            - $ref: '#/components/schemas/TenantRequestPayload'

    TechnicalAssignment:
      type: object
      additionalProperties: false
      required: [technical_assignment_id, scenario, schema_version, revision, lifecycle_status, has_exact_address, payload, created_at, updated_at]
      properties:
        technical_assignment_id:
          type: string
          format: uuid
        scenario:
          type: string
          enum: [need_tenant, need_property]
        schema_version:
          type: string
          enum: ['1.0']
        revision:
          type: integer
          minimum: 1
        lifecycle_status:
          type: string
          enum: [draft, ready_for_analysis, campaign_started]
        has_exact_address:
          type: boolean
          description: True if a protected property_exact_address is stored. The raw address itself is never included in any response.
        payload:
          oneOf:
            - $ref: '#/components/schemas/PropertyPayload'
            - $ref: '#/components/schemas/TenantRequestPayload'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAnalysisSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - idempotency_key
        - technical_assignment_id
        - expected_revision
        - analysis_kind
        - campaign_id
        - retry_of_analysis_snapshot_id
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        technical_assignment_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        expected_revision:
          type: integer
          minimum: 1
        analysis_kind:
          type: string
          enum: [pre_launch, post_launch_refresh]
        campaign_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
            - type: 'null'
        retry_of_analysis_snapshot_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
            - type: 'null'

    AnalysisMetricEvidence:
      type: object
      additionalProperties: false
      required: [method, filters_applied, dataset_revision]
      properties:
        method:
          type: string
        filters_applied:
          type: array
          items: { type: string }
        dataset_revision:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'

    AnalysisMetric:
      type: object
      additionalProperties: false
      required: [metric_status, confidence, value, sample_size, evidence, reason_codes, assumptions]
      properties:
        metric_status:
          type: string
          enum: [assessed, insufficient_data]
        confidence:
          type: [string, 'null']
          enum: [low, medium, high, null]
        value:
          description: Metric-specific aggregate object. Decimal monetary rates are fixed two-decimal strings.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        sample_size:
          type: integer
          minimum: 0
        evidence:
          $ref: '#/components/schemas/AnalysisMetricEvidence'
        reason_codes:
          type: array
          items: { type: string }
        assumptions:
          type: array
          items: { type: string }

    AnalysisResults:
      type: object
      additionalProperties: false
      required: [price_adequacy, competition, deal_probability_30d, candidate_categories]
      properties:
        price_adequacy:
          $ref: '#/components/schemas/AnalysisMetric'
        competition:
          $ref: '#/components/schemas/AnalysisMetric'
        deal_probability_30d:
          $ref: '#/components/schemas/AnalysisMetric'
        candidate_categories:
          $ref: '#/components/schemas/AnalysisMetric'

    AnalysisFailure:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code:
          type: string
          enum: [ANALYSIS_DATASET_UNAVAILABLE, ANALYSIS_GENERATION_FAILED]
        retryable:
          type: boolean

    AnalysisSnapshot:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - analysis_snapshot_id
        - technical_assignment_id
        - source_revision
        - scenario
        - analysis_kind
        - campaign_id
        - calculation_attempt
        - status
        - freshness_status
        - freshness_reason
        - method_version
        - market_context
        - input_fingerprint
        - evidence_dataset_revision
        - evidence_as_of
        - generated_at
        - created_at
        - failure
        - results
      properties:
        schema_version: { type: string, enum: ['1.0'] }
        analysis_snapshot_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        technical_assignment_id:
          $ref: '#/components/schemas/UuidV4OrV7'
        source_revision: { type: integer, minimum: 1 }
        scenario: { type: string, enum: [need_tenant, need_property] }
        analysis_kind: { type: string, enum: [pre_launch, post_launch_refresh] }
        campaign_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV4OrV7'
            - type: 'null'
        calculation_attempt: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, completed, insufficient_data, failed] }
        freshness_status: { type: string, enum: [current, stale] }
        freshness_reason:
          type: [string, 'null']
          enum: [revision_changed, campaign_mismatch, evidence_revoked, null]
        method_version: { type: string, enum: [synthetic_ru_v1] }
        market_context:
          type: object
          additionalProperties: false
          required: [country_code, currency, locale, area_unit, rent_period]
          properties:
            country_code: { type: string, enum: [RU] }
            currency: { type: string, enum: [RUB] }
            locale: { type: string, enum: [ru-RU] }
            area_unit: { type: string, enum: [sqm] }
            rent_period: { type: string, enum: [month] }
        input_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        evidence_dataset_revision: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        evidence_as_of: { type: [string, 'null'], format: date-time }
        generated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/AnalysisFailure'
            - type: 'null'
        results:
          oneOf:
            - $ref: '#/components/schemas/AnalysisResults'
            - type: 'null'

    AnalysisErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          enum:
            - ANALYSIS_SNAPSHOT_NOT_FOUND
            - ANALYSIS_TECHNICAL_ASSIGNMENT_NOT_FOUND
            - ANALYSIS_TECHNICAL_ASSIGNMENT_NOT_READY
            - ANALYSIS_REVISION_CONFLICT
            - ANALYSIS_KIND_INVALID
            - ANALYSIS_CAMPAIGN_REQUIRED
            - ANALYSIS_CAMPAIGN_MISMATCH
            - ANALYSIS_MARKET_UNSUPPORTED
            - ANALYSIS_DATASET_UNAVAILABLE
            - ANALYSIS_GENERATION_FAILED
            - ANALYSIS_IDEMPOTENCY_CONFLICT
            - ANALYSIS_RETRY_NOT_ALLOWED
            - ANALYSIS_RETRY_TARGET_MISMATCH
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean

