services:
  # POSTGRES_USER here is the cluster BOOTSTRAP/ADMIN identity only (see
  # 03_ARCHITECTURE/decisions/ADR-0005-least-privilege-database-boundary.md).
  # It is used solely by `npm run provision-roles` (LEASEMIND_BOOTSTRAP_DATABASE_URL)
  # and test infrastructure -- never by server.ts, migrate-cli.ts or
  # seed-cli.ts, which use lmapp_api_reader / lmapp_migrator / lmapp_maintainer
  # (created by provision-roles, granted by migration 003) instead.
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: lmapp_dev
      POSTGRES_PASSWORD: synthetic-dev-only-password
      POSTGRES_DB: lmapp_dev
    ports:
      - "127.0.0.1:5433:5432"
    # Local pilot data must survive Docker Desktop and Windows restarts.
    # Removal remains an explicit operation (`docker compose down -v`).
    volumes:
      - leasemind_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmapp_dev -d lmapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  leasemind_postgres_data:
